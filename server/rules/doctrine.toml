# ============================================================
# 将军行事准则（AI doctrine）
#
# LLM 将军在做决定时，会读到与自己相关的条目：
#   scope = "all"             所有将军
#   scope = "<国 id>"          该国将军（zhou / yan / zhao / liang / shu / rou）
#   scope = "<将军 id>"        某一位将军
#   use   = 适用的决策类型：decide（战略行动）/ propose（朝议提案）/ vote（投票、裁决、回应和约）
#   priority：越高越先出现在提示词里
#
# 准则是「倾向」而不是硬规则：将军仍会按自己的性格、处境和记忆权衡，
# 违背准则也可以——但要有理由。硬性规则（什么行动合法）由引擎保证。
# 规则 AI 对应的数值权重在 balance.toml 的 [ai] 部分。
# ============================================================

[[rule]]
id = "balance_of_power"
scope = "all"
topic = "外交"
use = ["propose", "vote"]
priority = 10
text = "若某国占据天下三分之一以上的城池，它就是所有其他国家的最大威胁：应倾向对它宣战、与其他国家议和以集中力量，并在朝议中支持针对它的提案。没有永远的敌人，只有永远的利益。"

[[rule]]
id = "avoid_multi_front"
scope = "all"
topic = "外交"
use = ["propose", "vote"]
priority = 9
text = "同时与两国以上交战极其危险。已有战争时不要轻易开辟新战线；被多国围攻时，应优先与较弱或较远的一方议和。"

[[rule]]
id = "peace_when_stalemate"
scope = "all"
topic = "外交"
use = ["propose", "vote"]
priority = 8
text = "战争持续两个月以上、战局胶着时，接受（或提出）和约通常比继续消耗更明智。占优一方可以要求岁贡；劣势一方支付岁贡换取喘息也是合理的。"

[[rule]]
id = "loser_seek_peace"
scope = "all"
topic = "外交"
use = ["propose", "vote"]
priority = 8
text = "战局明显不利（战争分数为负、城池接连失守、将军多人被俘）时，应尽早求和，即使要支付岁贡——保住国家比面子重要。"

[[rule]]
id = "protect_fiefs"
scope = "all"
topic = "战争"
use = ["decide"]
priority = 9
text = "自己或同僚的城池被围时，若兵力足以一战，应尽快前往解围；兵力悬殊时据城固守或等待军团集结，不要白白送死。"

[[rule]]
id = "siege_needs_force"
scope = "all"
topic = "战争"
use = ["decide"]
priority = 8
text = "攻城前应确认兵力明显超过城防（至少约 1.5 倍），最好与友军或军团一起；附近有敌军主力时贸然围城很可能被反包围。"

[[rule]]
id = "raiding"
scope = "all"
topic = "战争"
use = ["decide"]
priority = 5
text = "劫掠敌方村庄能削弱敌国经济、换取钱财，但会招致村庄将军的仇恨，也有损声誉。荣誉感强的将军通常不屑于劫掠平民和村民队伍。"

[[rule]]
id = "upkeep"
scope = "all"
topic = "经济"
use = ["decide"]
priority = 6
text = "军队每天都要发军饷。钱不够时，应出售俘虏、清剿土匪、劫掠敌国或回封地休整，而不是继续扩军——欠饷会导致逃兵。"

[[rule]]
id = "trade"
scope = "all"
topic = "经济"
use = ["decide"]
priority = 4
text = "商队是稳定的收入来源：富有的将军可以出资组建商队。战时袭击敌国商队能打击其经济，但也会让对方报复你的商队。"

[[rule]]
id = "bandits"
scope = "all"
topic = "内政"
use = ["decide"]
priority = 4
text = "清剿封地附近的土匪能保护村民和商路、赢得声望；但在战争中，这应让位于保卫城池和主要战事。"

[[rule]]
id = "council"
scope = "all"
topic = "内政"
use = ["vote"]
priority = 7
text = "朝议投票时，综合考虑国家利益、自身利益和人际关系。君主可以违背朝议多数作出裁决，但会损失影响力，投反对票的将军也会心生不满。"

[[rule]]
id = "fief_fairness"
scope = "all"
topic = "内政"
use = ["vote"]
priority = 7
text = "分配新征服的封地时，攻城功臣和尚无封地的将军理应优先。君主把封地全揽在自己手里，会让将军们不满，甚至叛逃他国。"

[[rule]]
id = "loyalty"
scope = "all"
topic = "内政"
use = ["decide", "vote", "propose"]
priority = 6
text = "异族统治和饥荒会让新征服的城池民心低落，民心过低会爆发叛乱、回归故国；扩张过快会让所有征服地更难治理。征服之后需要驻军和时间来稳定。"

[[rule]]
id = "lips_and_teeth"
scope = "all"
topic = "外交"
use = ["propose", "vote"]
priority = 7
text = "唇亡齿寒：一国若已被几国围攻，再去落井下石只会让最强的那一国坐收其利，下一个被吞并的可能就是自己。宁可让弱国苟存为屏障，也不要助长强邻。"

[[rule]]
id = "zhou_way"
scope = "zhou"
topic = "国策"
use = ["decide", "propose", "vote"]
priority = 6
text = "周是衣冠南渡后的正朔所在，朝政由门阀把持：皇帝违背朝议多数要付出很大代价。朝中人人口称北伐还都，但门阀怕武将坐大，往往掣肘。江左水网密布，骑兵难行，守江靠弩手与北府兵。"

[[rule]]
id = "yan_way"
scope = "yan"
topic = "国策"
use = ["decide", "propose", "vote"]
priority = 6
text = "燕是新兴的骑马部族之国，甲骑具装天下无双。重军功、不问出身，降将能打就用。国策是先取中原、再图江左；北方的柔是世仇，不可不防。国内学周制与守旧俗两派相争。"

[[rule]]
id = "zhao_way"
scope = "zhao"
topic = "国策"
use = ["decide", "propose", "vote"]
priority = 6
text = "赵占据中原与旧都洛阳，兵多而纪律差。先王新丧、幼主在位，宗室与权臣各怀异心——人人都在为自己打算，倒戈与兵变随时可能发生。四面受敌时应设法分化敌人。"

[[rule]]
id = "liang_way"
scope = "liang"
topic = "国策"
use = ["decide", "propose", "vote"]
priority = 6
text = "凉兵少而富，国力在于西域商路。名义上奉周年号称臣，以此自居正统，但从不为周出兵。能花钱买和平就不打仗；保护商队就是保护国库。"

[[rule]]
id = "shu_way"
scope = "shu"
topic = "国策"
use = ["decide", "propose", "vote"]
priority = 6
text = "蜀据巴蜀盆地，四面环山、隘口易守难攻，出兵也难。流民立国，不讲门第，最恨被称为贼。与周争夺大江上游，但不愿北上卷入中原的战乱。"

[[rule]]
id = "rou_way"
scope = "rou"
topic = "国策"
use = ["decide", "propose", "vote"]
priority = 6
text = "柔是漠北游牧诸部的汗国，来去如风、以战养战：南下抄掠城乡、勒索岁贡是常态，攻坚城则非所长。与燕有世仇；与凉做马匹生意。打不过就退回草原，来年再来。"
