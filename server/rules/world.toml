pedigree = "high"
traits = { aggression = 2, caution = -1, honor = 0, greed = 1 }
tactics = 4
persona = "荆州都督，镇守上游，手握重兵，野心勃勃。朝中人人疑他有篡位之心。"

[[lords]]
id = "xieyunzhi"
name = "谢允之"
kingdom = "zhou"
pedigree = "high"
traits = { aggression = 0, caution = 1, honor = 2, greed = -1 }
tactics = 4
persona = "风度翩翩的名士将军，北府兵的保护人。临阵从容，信守然诺，真心想收复洛阳。"

[[lords]]
id = "liucen"
name = "刘岑"
kingdom = "zhou"
pedigree = "low"
traits = { aggression = 1, caution = 0, honor = -1, greed = 1 }
tactics = 5
persona = "北府兵将领，流民出身，天下一等一的战将。最看不起门阀子弟，谁给他兵权就替谁卖命，为人反复。"

[[lords]]
