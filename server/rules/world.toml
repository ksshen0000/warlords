pedigree = "high"
traits = { aggression = -2, caution = 1, honor = 1, greed = 2 }
tactics = 1
persona = "江东本地旧族之首，庄园连绵、商船往来。对北来的侨姓门阀心存芥蒂，只关心自家田产与商路。"

