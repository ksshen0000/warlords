# ============================================================
# 世界设定：诸国、将军、初始关系与战争、地名。
# 背景见 docs/worldbuilding.md（南北朝架空：周 / 燕 / 赵 / 凉 / 蜀 / 柔）。
# 可以手写，也可以让 AI 生成新的世界（保持同样的结构即可）。
# ============================================================

# 地图布局（刻意简化：每国 4 座城池，村落不多，便于看清局势）
[layout]
fortified = ["town", "town", "castle", "castle"]   # 每国据点：第一个是都城
villages_per_town = 2
villages_per_castle = 1
hideouts = 10            # 匪巢总数（其中一部分开局处于沉寂状态）
fords = 4                # 大江上的渡口数（大江之外不可渡）
basin = [0.22, 0.68, 0.14, 0.17]   # 群山环抱的盆地：[中心x, 中心y, 半径x, 半径y]（0..1 比例），蜀在其中
basin_passes = [-90, -35, 0]       # 盆地的隘口方位（度；0 = 正东，-90 = 正北）。大江从正东的峡口流出

# 国：capital 为都城在地图上的大致位置（0..1 比例，x 向东、y 向南）；
#   title 为君主称号；fiefs 为初始封地分配，顺序同 [layout] fortified（都城在最前），
#   对应 [names] 中该文化的前几个地名；名单中没有出现的将军初始无封地（领津贴，靠战功求封）。
[[kingdoms]]
id = "zhou"
pedigree_weight = 1.0        # 分封时看重门第的程度（0 = 不问出身，1 = 只看门第）
town_min_pedigree = "mid"    # 封「城」所需的最低门第（空 = 不限）
captive_recruit = -0.05       # 招降俘虏将领的成功率加成
blurb = "江左水乡，衣冠南渡后的正朔所在。门阀当道，寒门难出头；北府兵却是天下劲旅。兵种以弩手、步兵见长。"
name = "周"
title = "皇帝"
culture = "zhou"
color = "#d65a4a"
capital = [0.7, 0.8]
ruler = "weixi"
fiefs = ["weixi", "huanjun", "liucen", "xieyunzhi"]

[[kingdoms]]
id = "yan"
pedigree_weight = 0.1        # 分封时看重门第的程度（0 = 不问出身，1 = 只看门第）
town_min_pedigree = ""    # 封「城」所需的最低门第（空 = 不限）
captive_recruit = 0.2       # 招降俘虏将领的成功率加成
blurb = "辽东草场，新兴的骑马部族之国。重军功不问出身，甲骑具装天下无双。兵种以骑兵见长。"
name = "燕"
title = "大单于"
culture = "yan"
color = "#5b8def"
capital = [0.8, 0.27]
ruler = "tuoyanlie"
fiefs = ["tuoyanlie", "cuiyan", "tuoyanxiao", "chiyuntiefa"]

[[kingdoms]]
id = "zhao"
pedigree_weight = 0.5        # 分封时看重门第的程度（0 = 不问出身，1 = 只看门第）
town_min_pedigree = ""    # 封「城」所需的最低门第（空 = 不限）
captive_recruit = 0.08       # 招降俘虏将领的成功率加成
blurb = "中原腹地，旧都洛阳所在。人口最多、战乱最烈，幼主在位、宗室争权。兵种步骑均衡。"
name = "赵"
title = "天王"
culture = "zhao"
color = "#e0a030"
capital = [0.5, 0.47]
ruler = "qushian"
fiefs = ["qushian", "quhezhao", "qinxiao", "hugulang"]

[[kingdoms]]
id = "liang"
pedigree_weight = 0.6        # 分封时看重门第的程度（0 = 不问出身，1 = 只看门第）
town_min_pedigree = ""    # 封「城」所需的最低门第（空 = 不限）
captive_recruit = 0.0       # 招降俘虏将领的成功率加成
blurb = "河西走廊的绿洲诸城，商路的咽喉。富庶而兵少，胡商云集、佛寺林立。兵种以弩手与轻骑见长。"
name = "凉"
title = "凉公"
culture = "liang"
color = "#2fb5a8"
capital = [0.17, 0.3]
ruler = "lingshouyi"
fiefs = ["lingshouyi", "kangqieluo", "suoyuanting", "xinxiao"]

[[kingdoms]]
