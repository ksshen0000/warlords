# ============================================================
# 世界设定：王国、领主、初始关系与战争、地名。
# 可以手写，也可以让 AI 生成新的世界（保持同样的结构即可）。
# ============================================================

# 王国：capital 为首都在地图上的大致位置（0..1 比例）；fiefs 为初始封地分配：
#   [首都, 第二城镇, 城堡1, 城堡2, 城堡3]，名单中没有出现的领主初始无封地
[[kingdoms]]
id = "frost"
name = "霜原王国"
culture = "frost"
color = "#5b8def"
capital = [0.5, 0.17]
ruler = "edwin"
fiefs = ["edwin", "hilda", "sigrid", "edwin", "ulf"]

[[kingdoms]]
id = "sand"
name = "赤沙苏丹国"
culture = "sand"
color = "#e0a030"
capital = [0.18, 0.62]
ruler = "karim"
fiefs = ["karim", "jafar", "safiya", "rashid", "karim"]

[[kingdoms]]
id = "river"
name = "翠河联盟"
culture = "river"
color = "#3fbf6a"
capital = [0.82, 0.5]
ruler = "vera"
fiefs = ["vera", "marco", "oren", "lin", "vera"]

[[kingdoms]]
id = "lion"
name = "金狮王国"
culture = "lion"
color = "#d65a4a"
capital = [0.52, 0.72]
ruler = "leon"
fiefs = ["leon", "cassia", "gareth", "leon", "isolde"]

# 领主：traits 取值 -2..2（aggression 好战 / caution 谨慎 / honor 荣誉 / greed 贪婪）；tactics 统御 0..5
[[lords]]
id = "edwin"
name = "艾德温·霜鬃"
kingdom = "frost"
traits = { aggression = 0, caution = 1, honor = 2, greed = -1 }
tactics = 3
persona = "霜原国王。年迈而重荣誉，厌恶背信者，宁可慢也不愿冒险。"

[[lords]]
id = "bran"
name = "布兰·铁拳"
kingdom = "frost"
traits = { aggression = 2, caution = -1, honor = 0, greed = 0 }
tactics = 3
persona = "边境悍将，渴望战功，觉得国王太过保守。"

[[lords]]
id = "hilda"
name = "希尔达·寒鸦"
kingdom = "frost"
traits = { aggression = -1, caution = 1, honor = -1, greed = 2 }
tactics = 1
persona = "富有的商城领主，精于算计，只在有利可图时出兵。"

[[lords]]
id = "ulf"
name = "乌尔夫·雪狼"
