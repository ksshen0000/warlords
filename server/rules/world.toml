# 将军：traits 取值 -2..2（aggression 好战 / caution 谨慎 / honor 荣誉 / greed 贪婪）；tactics 统御 0..5
# pedigree 门第：high 高门 / mid 次门 / low 寒门 / clan 部族贵种 / royal 宗室王族（后续「门第」机制使用）

# ---------------- 周 ----------------
[[lords]]
id = "weixi"
name = "卫晞"
kingdom = "zhou"
pedigree = "royal"
traits = { aggression = -1, caution = 1, honor = 1, greed = 0 }
tactics = 1
persona = "周朝皇帝，年方十九，聪明而无兵权。朝政握在门阀手里，他想借北伐收回权柄，却处处受制。"

[[lords]]
id = "yucheng"
name = "庾承"
kingdom = "zhou"
pedigree = "high"
traits = { aggression = -1, caution = 2, honor = 0, greed = 1 }
tactics = 2
persona = "庾氏家主、中书令，周朝实际的执政者。口称北伐还都，心里最怕北伐让武将坐大。"

[[lords]]
id = "huanjun"
name = "桓峻"
