# ============================================================
# 角色成长（仿骑砍式：属性、技能、武器熟练度、等级）。你本人和同伴共用这一套。
# 技能等级不能超过对应属性 ÷ skill_cap_div；队伍技能（party = true）取队伍里最高的那个人。
# 改这里的数值后「重载规则」即可生效；新加的技能需要开新局或读档时自动补 0 级。
# ============================================================

[level]
xp_base = 300                 # 升到 n+1 级所需的累计经验 = xp_base × n^xp_exp
xp_exp = 1.9
max_level = 40
attr_points = 1               # 每升一级得到的属性点
skill_points = 1              # 每升一级得到的技能点
start_attr_points = 2         # 开局可自由分配的点数
start_skill_points = 3
skill_cap_div = 3             # 技能上限 = 属性 ÷ 该值
max_skill = 10

[xp]
battle_per_enemy_power = 3.0  # 打胜仗：你这边分到的敌方损失战力 × 该值（亲自上阵再 ×1.5）
in_person = 1.5
loss_share = 0.25             # 打败仗也有一点经验
quest_per_gold = 0.6          # 完成差事：赏金 × 该值
arena_win = 120               # 擂台赢一场
companion_share = 0.8         # 同伴分到的经验比例

[prof]
names = { one_hand = "单手", two_hand = "双手", polearm = "长兵", bow = "弓", crossbow = "弩" }
start = 40
max = 300
per_hit = 2.2                 # 3D 战斗里每次命中加的熟练度（越高涨得越慢）
damage_per_100 = 0.12         # 每 100 点熟练度：伤害 +12%（以 100 为基准）
speed_per_100 = 0.06          # 每 100 点熟练度：出手 +6%

[attributes]
names = { str = "力量", agi = "敏捷", int = "智力", cha = "魅力" }
start = { str = 6, agi = 6, int = 5, cha = 5 }

# 技能：attr 对应属性，party = 队伍技能，per_level 每级效果（含义见 desc）
[skills.ironflesh]
name = "铁骨"
attr = "str"
per_level = 4
desc = "3D 战斗中生命 +{v}"

[skills.power_strike]
name = "强击"
attr = "str"
per_level = 0.08
desc = "近战伤害 +{p}"

[skills.power_draw]
name = "强弓"
attr = "str"
per_level = 0.12
desc = "弓的伤害 +{p}（弩不受影响）"

[skills.shield]
name = "盾术"
attr = "agi"
per_level = 0.06
desc = "举盾挡箭、背盾挡箭的几率 +{p}"

[skills.athletics]
name = "跑动"
attr = "agi"
per_level = 0.03
desc = "步行速度 +{p}"

[skills.riding]
name = "骑术"
attr = "agi"
per_level = 0.03
desc = "马速 +{p}"

[skills.horse_archery]
name = "骑射"
attr = "agi"
per_level = 0.1
desc = "马上射箭的散布 -{p}"

[skills.tactics]
name = "战术"
attr = "int"
party = true
per_level = 0.5
desc = "统帅战术 +{v}（自动结算战力、亲自上阵时的在场名额）"

[skills.pathfinding]
