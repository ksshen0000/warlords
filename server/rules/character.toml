party = true
per_level = 0.06
desc = "视野 +{p}"

[skills.surgery]
name = "医术"
attr = "int"
party = true
per_level = 0.04
desc = "我方阵亡者有 {p} 的机会只是重伤"

[skills.wound_treatment]
name = "疗伤"
attr = "int"
party = true
per_level = 0.2
desc = "伤员康复速度 +{p}"

[skills.trainer]
name = "训练"
attr = "int"
per_level = 0.6
desc = "每名健康士兵每天额外 +{v} 经验"

[skills.trade]
name = "交易"
attr = "cha"
per_level = 0.03
desc = "买东西便宜、卖东西贵 {p}"

[skills.leadership]
name = "统御"
attr = "cha"
per_level = 4
desc = "部队上限 +{v}，军饷 -{wage}"
wage_per_level = 0.04

# 家世：开局属性加成与起始技能（rules/world.toml 的 backgrounds 同名）
[backgrounds.refugee]
attr = { str = 1, cha = 1 }
skills = { athletics = 1, leadership = 1, wound_treatment = 1 }
prof = { polearm = 70 }

[backgrounds.lowborn]
attr = { str = 1, agi = 1 }
