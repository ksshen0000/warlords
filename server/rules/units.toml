# ============================================================
# 内容定义：地形、货物、文化与兵种树、土匪。
# 引擎与 AI 都读取本文件；增删兵种/货物只需改这里。
# ============================================================

# ---------------- 地形 ----------------
# speed：行军速度倍率（0 = 不可通行）；battle：该地形上各兵种的战斗力倍率
[terrain]
river_speed = 0.45   # 无桥涉水
road_speed = 1.35
ford_speed = 0.35   # 大江渡口（即使有路也这么慢：大军渡江要等船）

[terrain.deep_water]
name = "深海"
speed = 0.0

[terrain.water]
name = "浅海"
speed = 0.0

[terrain.beach]
name = "海岸"
speed = 0.9
village_goods = ["salt", "grain"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.plains]
name = "平原"
speed = 1.0
battle = { cav = 1.1 }
village_goods = ["grain", "grain", "cloth", "wine"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.meadow]
name = "草甸"
speed = 1.0
village_goods = ["grain", "wine", "cloth"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.forest]
name = "森林"
speed = 0.7
battle = { cav = 0.75, arc = 0.85 }
village_goods = ["wood", "wood", "fur"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.hills]
name = "丘陵"
speed = 0.72
battle = { cav = 0.85 }
village_goods = ["iron", "iron", "wine"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.mountain]
name = "山地"
speed = 0.0

[terrain.snow]
name = "雪原"
speed = 0.8
village_goods = ["fur", "fur", "iron"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.taiga]
name = "针叶林"
speed = 0.65
battle = { cav = 0.75, arc = 0.85 }
village_goods = ["fur", "wood"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.desert]
name = "荒漠"
speed = 0.85
village_goods = ["salt", "spice", "spice"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.dunes]
name = "沙丘"
speed = 0.62
battle = { inf = 0.9 }
village_goods = ["spice", "salt"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.steppe]
name = "草原"
speed = 1.05
battle = { cav = 1.15 }
village_goods = ["horse", "horse", "grain"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.marsh]
name = "沼泽"
speed = 0.55
battle = { cav = 0.7, inf = 0.9 }
village_goods = ["grain", "salt"]   # 该地形上的村庄出产（可重复以提高概率）

# ---------------- 货物 ----------------
[goods]
grain = { name = "粮食", price = 10 }
wood = { name = "木材", price = 16 }
salt = { name = "盐", price = 28 }
iron = { name = "铁矿", price = 38 }
cloth = { name = "丝帛", price = 34 }
fur = { name = "毛皮", price = 46 }
wine = { name = "酒", price = 52 }
spice = { name = "西域香料", price = 85 }
horse = { name = "马匹", price = 120 }

# ---------------- 兵种通用 ----------------
# tier_power：各等级基础战力；class_power / class_upkeep：兵种类型倍率
# matchup：克制关系（攻击方类型 -> 被攻击方类型 -> 倍率）
[classes]
tier_power = { t0 = 0.45, t1 = 1.0, t2 = 2.0, t3 = 3.4, t4 = 5.3 }
power = { inf = 1.0, arc = 1.0, cav = 1.25 }
upkeep = { inf = 1.0, arc = 1.0, cav = 1.6 }
names = { inf = "步兵", arc = "射手", cav = "骑兵" }
matchup = { inf = { cav = 1.2 }, arc = { inf = 1.2 }, cav = { arc = 1.3 } }

# ---------------- 文化与兵种树 ----------------
# 每个文化：新兵 -> 步兵线(t2..t4) / 射手线(t2..t4)，步兵 t2 还可转骑兵线(t3..t4)
# bonus：文化兵种加成（<1 为减益）；home：主场地形；workshop：城中作坊产出的货物；
# class_pref：该文化将军升级部队时偏好的兵种（权重）

[cultures.zhou]
name = "江左"
bonus = { arc = 1.10, inf = 1.05, cav = 0.9 }
home = ["marsh", "forest", "meadow"]
workshop = "cloth"
class_pref = { inf = 1.2, arc = 1.4, cav = 0.6 }
recruit = "江左乡勇"
infantry = ["持盾甲士", "长戟兵", "北府精兵"]
archers = ["弓手", "强弩手", "蹶张弩士"]
cavalry = ["江左轻骑", "部曲骑士"]

[cultures.yan]
name = "辽东"
bonus = { cav = 1.15 }
home = ["steppe", "plains", "taiga"]
workshop = "fur"
class_pref = { inf = 0.8, arc = 0.9, cav = 1.6 }
recruit = "部落少年"
infantry = ["汉军步卒", "刀盾卫", "宿卫郎"]
archers = ["猎手", "辽东射士", "射雕手"]
cavalry = ["辽东轻骑", "甲骑具装"]

[cultures.zhao]
name = "河北"
bonus = { inf = 1.05, cav = 1.05 }
home = ["plains", "hills", "meadow"]
workshop = "iron"
class_pref = { inf = 1.3, arc = 0.9, cav = 1.2 }
recruit = "中原丁壮"
infantry = ["刀盾兵", "赤帻锐士", "天王亲军"]
archers = ["弓手", "强弓手", "河北神射"]
cavalry = ["屈赫游骑", "屈赫铁骑"]

[cultures.liang]
name = "河西"
bonus = { arc = 1.08, cav = 1.05 }
home = ["desert", "dunes", "steppe"]
workshop = "spice"
class_pref = { inf = 0.9, arc = 1.3, cav = 1.2 }
recruit = "绿洲丁壮"
infantry = ["戍卒", "长斧手", "西州重甲"]
archers = ["弩手", "西州射士", "白羽神射"]
cavalry = ["河西轻骑", "驼甲骑"]

[cultures.shu]
name = "巴蜀"
bonus = { inf = 1.08, arc = 1.08, cav = 0.85 }
home = ["hills", "forest"]
workshop = "cloth"
class_pref = { inf = 1.4, arc = 1.3, cav = 0.5 }
recruit = "山民"
infantry = ["藤牌手", "山地刀斧手", "蜀中白甲"]
archers = ["竹弓手", "连弩手", "蜀中神弩"]
cavalry = ["山地驮骑", "巴蜀骑士"]

[cultures.rou]
name = "漠北"
bonus = { cav = 1.12, arc = 1.05, inf = 0.9 }
home = ["steppe", "snow", "taiga"]
workshop = "horse"
class_pref = { inf = 0.6, arc = 1.0, cav = 1.8 }
recruit = "牧民"
infantry = ["部众", "狼卫", "金帐卫士"]
archers = ["牧猎手", "漠北射手", "落雕手"]
cavalry = ["漠北游骑", "柔骨重骑"]

