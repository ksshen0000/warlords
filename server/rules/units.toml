# ============================================================
# 内容定义：地形、货物、文化与兵种树、土匪。
# 引擎与 AI 都读取本文件；增删兵种/货物只需改这里。
# ============================================================

# ---------------- 地形 ----------------
# speed：行军速度倍率（0 = 不可通行）；battle：该地形上各兵种的战斗力倍率
[terrain]
river_speed = 0.45   # 无桥涉水
road_speed = 1.35

[terrain.deep_water]
name = "深海"
speed = 0.0

[terrain.water]
name = "浅海"
speed = 0.0

[terrain.beach]
name = "海岸"
speed = 0.9
village_goods = ["salt", "grain"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.plains]
name = "平原"
speed = 1.0
battle = { cav = 1.1 }
village_goods = ["grain", "grain", "cloth", "wine"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.meadow]
name = "草甸"
speed = 1.0
village_goods = ["grain", "wine", "cloth"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.forest]
name = "森林"
speed = 0.7
battle = { cav = 0.75, arc = 0.85 }
village_goods = ["wood", "wood", "fur"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.hills]
name = "丘陵"
speed = 0.72
battle = { cav = 0.85 }
village_goods = ["iron", "iron", "wine"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.mountain]
name = "山地"
speed = 0.0

[terrain.snow]
name = "雪原"
speed = 0.8
village_goods = ["fur", "fur", "iron"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.taiga]
name = "针叶林"
speed = 0.65
battle = { cav = 0.75, arc = 0.85 }
village_goods = ["fur", "wood"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.desert]
name = "荒漠"
speed = 0.85
village_goods = ["salt", "spice", "spice"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.dunes]
name = "沙丘"
speed = 0.62
battle = { inf = 0.9 }
village_goods = ["spice", "salt"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.steppe]
name = "草原"
speed = 1.05
battle = { cav = 1.15 }
village_goods = ["horse", "horse", "grain"]   # 该地形上的村庄出产（可重复以提高概率）

[terrain.marsh]
name = "沼泽"
speed = 0.55
battle = { cav = 0.7, inf = 0.9 }
village_goods = ["grain", "salt"]   # 该地形上的村庄出产（可重复以提高概率）

# ---------------- 货物 ----------------
[goods]
grain = { name = "粮食", price = 10 }
wood = { name = "木材", price = 16 }
salt = { name = "盐", price = 28 }
iron = { name = "铁矿", price = 38 }
cloth = { name = "布匹", price = 34 }
fur = { name = "毛皮", price = 46 }
wine = { name = "葡萄酒", price = 52 }
spice = { name = "香料", price = 85 }
horse = { name = "马匹", price = 120 }

# ---------------- 兵种通用 ----------------
# tier_power：各等级基础战力；class_power / class_upkeep：兵种类型倍率
# matchup：克制关系（攻击方类型 -> 被攻击方类型 -> 倍率）
[classes]
tier_power = { t0 = 0.45, t1 = 1.0, t2 = 2.0, t3 = 3.4, t4 = 5.3 }
power = { inf = 1.0, arc = 1.0, cav = 1.25 }
upkeep = { inf = 1.0, arc = 1.0, cav = 1.6 }
names = { inf = "步兵", arc = "射手", cav = "骑兵" }
matchup = { inf = { cav = 1.2 }, arc = { inf = 1.2 }, cav = { arc = 1.3 } }

# ---------------- 文化与兵种树 ----------------
# 每个文化：新兵 -> 步兵线(t2..t4) / 射手线(t2..t4)，步兵 t2 还可转骑兵线(t3..t4)
# bonus：文化兵种加成；home：主场地形

[cultures.frost]
name = "霜原"
bonus = { inf = 1.12 }
home = ["snow", "taiga"]
recruit = "霜原新兵"
infantry = ["持盾步兵", "战斧手", "熊皮狂战士"]
archers = ["林地猎手", "霜原弓手", "雪鹰射手"]
cavalry = ["霜原游骑", "冰原重骑"]

[cultures.sand]
name = "赤沙"
bonus = { cav = 1.08, arc = 1.05 }
home = ["desert", "dunes"]
recruit = "沙漠新兵"
infantry = ["沙漠矛兵", "弯刀卫士", "苏丹禁卫"]
archers = ["沙丘投石手", "沙漠弓手", "烈日神射手"]
cavalry = ["骆驼骑手", "沙暴骑射手"]

[cultures.river]
name = "翠河"
bonus = { arc = 1.12 }
home = ["meadow", "forest", "marsh"]
recruit = "河谷新兵"
infantry = ["河谷枪兵", "联盟长枪兵", "翠河戟卫"]
archers = ["河谷弓手", "长弓手", "翠羽长弓手"]
cavalry = ["河谷轻骑", "河谷骑士"]

[cultures.lion]
name = "金狮"
bonus = { cav = 1.12 }
home = ["plains", "hills", "steppe"]
recruit = "金狮新兵"
infantry = ["王国步兵", "王国重步兵", "金狮近卫"]
archers = ["王国弩手", "重弩手", "王家神弩手"]
cavalry = ["王国侍从骑兵", "金狮骑士"]

