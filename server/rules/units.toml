# ---------------- 土匪类型 ----------------
# troop：主力兵种；terrain：会在这些地形安营扎寨
[bandits.mountain]
name = "山贼"
troop = "bandit_mountain"
terrain = ["hills"]
[bandits.forest]
name = "森林强盗"
troop = "bandit_forest"
terrain = ["forest", "taiga"]
[bandits.desert]
name = "沙漠劫匪"
troop = "bandit_desert"
terrain = ["desert", "dunes", "steppe"]
[bandits.frost]
name = "冰原掠夺者"
troop = "bandit_frost"
