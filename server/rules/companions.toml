# ============================================================
# 同伴（仿骑砍式：酒肆里能招募的具名人物，原创角色）。
# 招募后随队作战、分享经验、各自成长和换装；队伍技能取队里最高的人。
# likes / dislikes：玩家这些举动会让他高兴 / 不满（见 [morale] 的事件）；rival：同队时彼此看不顺眼。
# attr / skills / prof 叠加在 character.toml 的起始值上；equip 是 items.toml 的物品。
# ============================================================

[rules]
start_morale = 60
leave_below = 15              # 士气低于此值就离队
return_days = 30              # 离队后多少天出现在别的酒肆
move_days = 12                # 没招募的同伴隔多少天换一家酒肆
wound_days = 3                # 战场上被打倒后养伤几天（期间不上阵、不提供队伍技能）
drift = 1.0                   # 士气每天向 start_morale 回归的量
rival_per_day = 0.6           # 宿敌同队时每天的士气损失
unpaid = 8                    # 发不出薪水时每人士气 -8

[morale]                      # 事件 -> 士气变化（按喜恶）
raid = 12                     # 劫掠村庄
execute = 15                  # 斩杀俘虏的将军
release = 6                   # 释放俘虏的将军
victory = 3                   # 打胜仗
defeat = 6                    # 打败仗、被俘
loot = 2                      # 喜欢发财的人：战后缴获

[companions.tan]
name = "檀道余"
culture = "zhou"
troop = "zhou_cav3"
title = "落魄将门之后"
story = "祖上随周室南渡，做过一任刺史。到他这一代家道中落，只剩一身弓马和几卷兵书。他想在乱世里重振门楣，又看不惯为非作歹的人。"
hire = 450
wage = 9
attr = { str = 1, int = 2, cha = 1 }
skills = { tactics = 2, leadership = 1, riding = 1, power_strike = 1 }
prof = { one_hand = 110, bow = 80 }
equip = ["sword", "round", "bow", "helm", "liangdang", "nag"]
likes = ["release", "victory"]
dislikes = ["raid", "execute"]
rival = "hulu"

