# ============================================================
# 数值平衡。引擎启动时读取；服务器运行中可通过 POST /reload 热更新。
# 改平衡 = 改这里，不需要改代码。
# ============================================================

[time]
decide_every_hours = 6        # 领主战略决策的检查间隔（小时）
replan_after_hours = 48       # 一条命令执行多久后重新考虑
urgent_replan_hours = 6       # 自己的封地被围时，多快放下手头的低优先级命令

[movement]
base_speed = 5.5              # 普通部队在平原上的速度（地图单位/小时）
cavalry_bonus = 0.5           # 全骑兵部队的额外速度（按骑兵比例折算：骑兵多走得快，全是步卒就慢）
size_penalty_per_troop = 0.004  # 每名士兵带来的减速（伤员算半个）：小股人马跑得快，大军慢（仿战团）
min_size_factor = 0.55
kind_speed = { lord = 1.0, caravan = 0.75, villager = 0.7, bandit = 1.0, hunter = 1.15, merc = 1.0, player = 1.1, refugee = 0.6 }   # 快慢主要看兵种：马匪靠骑兵比例跑得快，步行的流寇就慢

# 津渡摆渡（黄河、长江只能坐船过，少数浮桥除外）：到了渡口要等船，人马越多越久
ferry_base_hours = 1.0        # 小股人马也要等一两个时辰
ferry_men_per_hour = 25       # 每个时辰能运过多少人
ferry_cav_weight = 2.0        # 一骑当两人运（马难上船）
ferry_max_hours = 36.0

[battle]
max_rounds = 6
damage_rate = 0.085           # 每回合把战力转化为伤亡的比例
luck_sigma = 0.22             # 每回合运气的对数正态分布宽度（越大越随机）
tactics_bonus = 0.06          # 统帅每点统御带来的战力加成
attacker_break = 0.45         # 攻方剩余兵力低于开战时的这个比例就溃退
defender_break = 0.40
timeout_defender_edge = 1.1   # 打满回合都没人溃退时，按剩余战力定胜负：攻方要强过守方这个倍数才算赢
wound_rate = { default = 0.6, bandit = 0.45, villager = 0.4, caravan = 0.55 }   # 伤亡中受伤（而非阵亡）的比例
xp_per_enemy_power = 2.5      # 胜方获得经验 = 敌方损失战力 × 该值

[troops]
upkeep_per_tier = 0.28        # 每级每天军饷（骑兵再乘兵种倍率）
recruit_cost = { t1 = 12, t2 = 30 }
xp_per_tier_squared = 30      # 升级所需经验 = 该值 × 等级²
upgrade_cost_per_tier = 8     # 升级花费（骑兵 ×2）
heal_rate_field = 0.18        # 伤员每天康复率（野外）
heal_rate_settlement = 0.35   # 在城中
party_limit_base = 70         # 部队规模上限 = base + 声望/4 + 每块封地 12（君主 +40）

[economy]
tariff = 0.06                 # 城镇交易关税（归城主）
town_tax_per_prosperity = 0.9 # 城镇日税 = 繁荣度 × 该值 + 关税
castle_tax = 45
village_tax_per_hearth = 0.25
ruler_stipend = 60            # 君主每日王室收入
landless_stipend = 45         # 无封地领主每日津贴
garrison_upkeep_share = 0.2   # 城主承担守军军饷的比例（其余由国库出；守军很多，城主全担会破产）
grain_need_base = 0.6         # 城镇每日粮食消耗 = base + 繁荣度 × per_prosperity
grain_need_per_prosperity = 0.02
farmland_grain = 1.0          # 城郊农田每日产粮
village_tithe_divisor = 25    # 村庄每日向所属城镇粮仓缴纳 繁荣/该值
village_production_divisor = 12  # 村庄每日产出 = 繁荣/该值
prosperity_growth = 0.12      # 吃饱时城镇繁荣日增长
starvation_prosperity_loss = 1.0
caravan_capacity = 40
caravan_respawn_chance = 0.1  # 没有商队的城镇每天组建新商队的概率

[siege]
progress_per_wall = 3200      # 攻城器械进度：每小时 + 攻方人数 /(城墙等级 × 该值)
wall_bonus_per_level = 0.45   # 强攻时守方战力 × (1 + 城墙等级 × 该值)
conquest_prosperity_loss = 15
garrison_left_share = 0.2     # 攻下后统帅留下的驻军比例
conquest_loyalty = 25         # 新征服据点的初始民心
town_garrison = 240           # 开局城的守军（城池少而大：每国只有 4 座）
castle_garrison = 175         # 开局关塞的守军
last_stand_bonus = 0.5        # 一国只剩最后 last_stand_forts 座城池时，守方战力额外 ×(1+该值)：困兽犹斗
last_stand_forts = 2

[raid]
duration_hours = 10
recovery_days = 8

[refugee]
# 流民：村庄被劫掠后，逃难的村民扶老携幼去最近的本国城池；路上会被匪寇盯上
size_base = 8                 # 人数 = base + 村庄繁荣 × per_prosperity
size_per_prosperity = 0.25
days = 7                      # 几天内没走到就散了
settle_prosperity = 0.5       # 到达城池（或你的封地）后每人增加的繁荣
heads_per_grain = 4           # 收编：每份粮食能养活几人
gold_per_head = 9             # 没有粮食时，每人折合多少金
resettle_renown = 2           # 把他们安置到你的封地，声望增加

[loyalty]
# 民心 0..100：异族统治、饥荒、过度扩张会让民心下降；民心太低会叛乱，回归同文化的王国。
start = 70
same_culture_drift = 0.5      # 统治者与当地同文化：每天 +
foreign_culture_drift = -0.35 # 异族统治：每天 +（负数）
overextension_per_fief = 0.06 # 王国城池数超过「公平份额」后，每多一座，所有异族据点每天额外 -
starvation_drift = -1.5
garrison_calm_per_100 = 0.3   # 每 100 名驻军让民心每天 +
rebellion_threshold = 20      # 民心低于此值时可能叛乱
rebellion_chance = 0.04       # 每天叛乱概率（民心越低越高）

[capture]
base_chance = 0.15            # 战败领主被俘的基础概率
per_loss_chance = 0.5         # 再按兵力损失比例增加
max_per_battle = 2            # 一场战斗最多俘获几位将军（其余的单骑突围；一战尽擒全国将领太少见）
escape_chance = 0.045         # 被俘领主每天越狱概率
ransom_chance = 0.12          # 君主每天考虑支付赎金的概率
ransom_base = 250
ransom_per_renown = 3
# ---- 处置俘虏的将军（玩家：招降 / 索赎 / 释放 / 斩首；AI 国家也会招降）
recruit_base = 0.22           # 招降基础成功率；另加：-荣誉×0.08、对旧主的不满、对你的好感、国家加成（world.toml captive_recruit）、你的威名
recruit_dread = 0.004         # 每点「威名」（斩过的将领越多越高）增加的招降成功率，上限见下
recruit_dread_max = 0.15
recruit_fief_penalty = 0.12   # 有封地的将军更难背弃旧主
ai_recruit_daily = 0.035      # AI 国家每天对每个关押的敌将尝试招降的概率（再乘成功率）
ransom_now_share = 0.8        # 当场索赎能拿到的比例（等待对方君主赎回则是全额，但要等几天）
release_relation = 15         # 无条件释放：他对你的好感
release_renown = 3
execute_renown = -15          # 斩首：声望变化（以残暴闻名）
execute_dread = 10            # 斩首：威名增加
execute_relation = -15        # 斩首：其国将领对你好感
execute_family = -40          # 斩首：其同族对你好感（再叠加上一条）

[quests]
# 差事（仿骑砍战团：向城主请缨办事，换钱、名望和好感——这是无名小卒出头的正路）
max_active = 3                # 同时最多接几件差事
offers_per_town = 2           # 每座城每天能打听到几件
min_relation = -10            # 城主对你的好感低于此值就不派差事
relation_gain = 6             # 办成后委托人好感
relation_loss = 5             # 逾期 / 办砸后委托人好感下降
hideout_range = 420           # 剿匪差事：多远之内的匪巢
hideout_gold = 450
hideout_renown = 12
hideout_days = 12
bandit_range = 180            # 追剿匪帮：城外多远的匪帮
bandit_gold = 220
bandit_renown = 6
bandit_days = 8
letter_gold_base = 60         # 送信：赏金 = base + 距离 × per_unit
letter_gold_per_unit = 0.2
letter_renown = 3
letter_days = 14
goods_qty = [6, 12]           # 运送物资：数量范围
goods_bonus = 180             # 按市价收货之外的辛苦钱
goods_max_value = 40          # 只派便宜的日用货（粮、木、盐、铁、布）
goods_renown = 4
goods_days = 14

[pedigree]
# 门第等级（用于分封权重）；每国看重门第的程度见 world.toml 的 pedigree_weight
rank = { royal = 4, high = 3, clan = 2.5, mid = 2, low = 1 }
vote_weight = 1.6             # 规则 AI 投票时：门第等级 × pedigree_weight × 该值

[politics]
war_proposal_cost = 60        # 提议宣战消耗影响力
peace_proposal_cost = 40
min_war_days = 10             # 开战多少天后才能提议议和
truce_days = 30
overrule_influence_cost = 30  # 君主违背议会多数意见的影响力代价
army_base_cost = 30
army_member_cost = 8
army_cohesion_decay = 2.0
army_cohesion_per_member = 0.6
defection_threshold = 55
defection_chance = 0.4
tribute_score_divisor = 2.5   # 岁贡 = 战争分数 / 该值（每日）
tribute_max = 220
tribute_days = 20

[bandits]
max_active_hideouts = 10
spawn_chance = 0.4            # 每个匪巢每天派出新匪帮的概率
max_parties_per_hideout = 4
looters_max = 20              # 不属于任何匪巢、在腹地村落之间游荡的小股流寇（仿战团的 looters）
looter_spawn_chance = 0.6     # 不够数时每天冒出一伙的概率
looter_size = [5, 15]
looter_regions = ["zhou", "zhao", "shu", "yan"]   # 只在这些国家的村落附近出没（中原、江南、巴蜀、辽东；草原荒漠归马贼）
hideout_respawn_days = 10
reactivate_chance = 0.35
bounty_per_bandit = 15
hideout_team = 12             # 亲自攻打匪巢时最多带几个人（像战团那样带精兵步战突入）
hideout_player_renown = 6     # 玩家剿灭匪巢得到的名望

[neutral]
bounty_hunters = 3

[player]
fief_village_rent = 2.0          # 食邑：村子交给玩家的租税，是普通村税的几倍（战团里一个村子一周数百金，足够贴补一支小部队）
start_gold = 2000
start_troops = 22
battle_bonus = 1.6            # 玩家部队战力倍率（目前给玩家较好的加成）
party_limit_base = 40         # 部队上限 = base + 声望/4 + 每块封地 10
cargo_base = 40               # 可携带货物 = base + 每名士兵 1
renown_per_victory_kill = 0.25  # 胜利时每个敌方伤亡带来的声望
flee_base_chance = 0.5        # 被追上时脱身的基础概率（速度比越有利越高）
pay_off_share = 0.3           # 向土匪交出的金钱比例
defeat_gold_loss = 0.25       # 战败被俘时损失的金钱比例
captive_days = 3              # 被俘后多少天逃脱
merc_pay_per_power = 0.12     # 佣兵合同日薪 = 部队战力 × 该值
merc_contract_days = 30
merc_min_troops = 10
summon_range = 900            # 封臣：本国在这么远之内召集军团时，会派人来召你          # 带的人少于这个数，没有君主会雇你当义从
escape_followers = 5          # 被俘逃脱时跟着你跑出来的同乡（不然一兵一卒都没有，只会被土匪反复抓）
vassal_renown = 120           # 宣誓效忠所需声望
vassal_relation = 0           # 以及与君主的最低好感
ransom_days = 3               # 你俘虏的领主多少天后由其君主赎回

[vision]
# 视野（类似骑砍战团的「侦察」技能）：只有视野内的部队会显示在地图上；城池村落始终可见，
# 但城防、守军和驻扎在里面的部队要走进视野、鼠标移上去才看得清（自家的据点除外）
base = 70                     # 白天的基础视野半径（地图单位，约等于「里」；骑行一天约 160）
cavalry_bonus = 30            # 全骑兵部队额外视野（按骑兵比例折算：游骑斥候放得更远）
renown_bonus_max = 20         # 名望带来的额外视野上限（老兵、向导、耳目），每 10 点名望 +1
night_factor = 0.55           # 夜里视野乘以该值
night_start = 20              # 几点入夜
night_end = 5                 # 几点天亮
inside_factor = 1.0           # 待在城里时（城头瞭望）
npc_base = 55                 # AI 部队的视野（同样受夜间和骑兵比例影响）：看不见的敌人就不会去追、也不会躲
fort_watch = 60               # 城池/关塞的瞭望范围：本国将领知道自家据点附近的敌情
village_watch = 40            # 村落报信的范围（烽火、乡民跑来报信）

# ------------------------------------------------------------------
# 规则 AI 的权重（LLM 领主读 doctrine.toml 里的文字准则，规则 AI 读这些数字；
# 两者描述的是同一套行事逻辑，注释里标出对应的准则 id）
# ------------------------------------------------------------------
[ai]
peace_per_war_day = 0.033         # peace_when_stalemate：战争每多一天更想议和
peace_per_extra_front = 0.8       # avoid_multi_front：每多一条战线
peace_tribute_weight = 0.02       # 岁贡对接受和约的吸引力
peace_loss_eagerness = 0.025      # 战局不利时（每点负分）更想议和
peace_win_greed = 0.0067          # 战局有利时（每点正分）略不想议和
peace_accept_threshold = 0.5
war_per_extra_front = 2.5         # avoid_multi_front：已有战争时不想再开新战线
war_strength_weight = 4.0
fief_ruler_self = 5.0            # 分封：君主想把新城留给自己的基础意愿（普通将军是 8；君主有王室收入，更愿意封给功臣）
fief_self_per_fief = 2.5         # 分封：已有封地的人（含君主自己）每多一块，再要城的意愿降低
fief_landless_contributor = 2.5
fief_request_weight = 3.0        # 分封：玩家攻城后当面请封，君主和诸将的投票加分  # 分封：没有封地的攻城功臣额外加分（玩家随军立功后能分到城）
war_ratio_cap = 1.8              # 实力比超过这个倍数不再增加宣战意愿（不会因为对方弱就一拥而上）
war_dogpile_penalty = 2.6        # lips_and_teeth：目标每多一个交战国，就更不想再落井下石
war_distance_weight = 2.2        # near_before_far：两国相距每多一天（超出下值），宣战意愿降低（整张图横穿约 15 天）
war_distance_free_days = 1.9
far_target_weight = 3.2          # near_before_far：攻打离本国城池太远的孤城，每多一天扣分
far_target_free_days = 1.9
war_peace_boredom_days = 40       # 和平太久会想打仗
hegemon_share = 0.33              # balance_of_power：一国城池占比超过此值视为霸主
hegemon_war_bonus = 8.0           # 对霸主宣战的意愿加成（随超出比例增长）
hegemon_peace_bonus = 2.0         # 与非霸主议和、集中力量对付霸主
besiege_idle_days_bonus = 6       # 很久没进攻会更想攻城（每 N 天 +1，最多 +5）

# ============================================================
# 大地图小事件（流民、逃兵、疫病、设宴……；内容在 content/events.toml）
[events]
near_range = 45                  # 离村镇多近才算「在附近」（地图单位≈里）
min_gap_days = 4                 # 两次事件至少隔几天
chance_scale = 1.0               # 所有事件触发概率的总倍率（0 = 关闭事件）

# ============================================================
# 对话（不连 LLM 时的话题对话；台词在 content/dialogue*.toml）
[dialogue]
flatter_cooldown_days = 7        # 对同一位将军套近乎，几天内只有第一次有效
flatter_max_rel = 20             # 好感到这个数以上，客套话就不再加好感了

# ============================================================
# 封地事务（玩家自己的城、关、食邑）
[fief]
garrison_step = 10               # 每次留下 / 抽调多少人
wall_cost = 600                  # 加固城墙：600 ×（目标等级）金
wall_max = 5
wall_days = 10                   # 两次加固至少隔几天（工匠在干活）
relief_cost = 300                # 开仓赈济
relief_loyalty = 12
relief_renown = 1
relief_days = 7
farm_cost = 400                  # 食邑修渠垦田
farm_prosperity = 6
farm_max = 80
farm_days = 10

# ============================================================
# 擂台比武（城里，3D 一对一，木兵器）
[arena]
prize = 60                       # 赢一场的赏钱
renown = 2
bets = [100, 300]                # 可以押的赌注（赢了一赔一）
cooldown_days = 2                # 同一座城的擂台隔几天再开
