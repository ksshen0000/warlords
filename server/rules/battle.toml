[weapons.crossbow]
name = "弩"
kind = "crossbow"
mount_reload = false          # 蹶张上弦要脚踩弩臂：马上只能射出事先上好的那一发
damage = 42
speed = 70
draw = 2.6                    # 上弦时间
ammo = 18

[shields.round]
name = "圆盾"
size = 0.55

[shields.rattan]
name = "藤牌"
size = 0.6

[shields.large]
name = "大橹"
mount = false                 # 步兵大盾，骑马时只能背着
size = 0.8

# ------------------------------------------------------------ 兵种配装
# 键 = 兵种类别 + 等级（inf1..inf4 / arc2..arc4 / cav3..cav4）；文化表覆盖默认表；
# melee 第一件是主武器；armor 护甲值；horse = "horse" / "barded"（具装）
[loadout.default]
inf0 = { melee = ["club"], armor = 2 }
inf1 = { melee = ["club"], armor = 5 }
inf2 = { melee = ["sword"], shield = "round", armor = 14 }
inf3 = { melee = ["spear", "sword"], shield = "round", armor = 24 }
inf4 = { melee = ["axe"], armor = 36 }
arc1 = { ranged = "bow", melee = ["knife"], armor = 5 }
arc2 = { ranged = "bow", melee = ["knife"], armor = 8 }
arc3 = { ranged = "bow", melee = ["sword"], armor = 14 }
arc4 = { ranged = "strongbow", melee = ["sword"], armor = 20 }
cav2 = { horse = "horse", melee = ["sword"], armor = 12 }
cav3 = { horse = "horse", melee = ["lance", "sword"], shield = "round", armor = 22 }
cav4 = { horse = "horse", melee = ["lance", "sword"], shield = "round", armor = 32 }

