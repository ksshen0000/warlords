# ============================================================
# 装备（玩家本人的装备栏：仿骑砍的武器四格 + 头 + 身 + 马）。
# 兵器、盾的战斗数值在 battle.toml 的 [weapons.*] [shields.*]：这里的物品用 base 指向它，
# 再按需覆盖几项（damage / thrust / speed / reach / ammo / draw / size / mount_reload…），
# 于是同一种兵器可以有不同成色（如「百炼环首刀」= 环首刀 + 伤害）。
# 兵种的配装仍在 battle.toml [loadout.*]，不受本表影响。
#
# type：melee 近战 / ranged 弓弩 / shield 盾 / head 头盔 / body 身甲 / horse 坐骑
# price 金；tier 档次（1–4，决定哪些城的兵器铺有货、战后能缴获什么）
# cultures：这些文化的城里更常见（省略 = 各地都有）；armor：头盔/身甲的护甲值
# 坐骑：kind = horse / barded（具装），hp 马的血量，speed 速度倍率，armor 马铠
# ============================================================

[equipment]
weapon_slots = 4              # 武器格：近战、弓弩、盾共用；同时最多一面盾、一张弓弩
sell_ratio = 0.45             # 卖给兵器铺的价钱 = 原价 × 此值
shop_size = 14                # 一家兵器铺的货色种数
restock_days = 7              # 每隔几天进一次新货
shop_tier_base = 2            # 兵器铺最高档次 = base + 繁荣 ÷ per（封顶 4）
shop_tier_per = 35
culture_weight = 3.0          # 本地文化的物品更常见
foreign_weight = 0.35         # 别处特产（cultures 不含本地）少见
loot_rolls_per = 12           # 战胜后：每击倒这么多敌人多一次缴获机会（至少一次，最多 loot_rolls_max）
loot_rolls_max = 4
loot_chance = 0.45            # 每次机会真的捡到东西的概率
loot_horse_weight = 0.3       # 缴获到马的相对概率（马难带回来）

[slot_names]
w1 = "武器一"
w2 = "武器二"
w3 = "武器三"
w4 = "武器四"
head = "头"
body = "身"
horse = "坐骑"

